openapi: 3.0.4
info:
  title: Credentials API
  description: >
    API for reading, creating, updating, archiving, unarchiving, and

    deleting credentials (encrypted logins/passwords).


    Authentication is performed using an API key associated with an active user.
    The user's RBAC permissions and client access are

    enforced server-side.


    The API uses GET for read operations and POST for create, update,

    archive, unarchive, and delete operations.

    API responses use a success field containing the string "True" or "False".


    Notes:

    - credential_username and credential_password are stored encrypted.
      Reading, creating, or updating either field requires
      api_key_decrypt_password
    - Field lengths are validated server-side against the values below;
      note that credential_username and credential_password are
      length-checked before encryption, so an encrypted value close to
      the limit can still fail to store - if this happens against the
      length limits below, it is a validation gap, not user error.
    - Credentials must be archived before they can be deleted.
  version: 1.0.0
servers:
  - url: https://develop.dev.itflow.org/api/v1
    description: Development API server - api_key is 'develop'
tags:
  - name: Credentials
    description: Credential management operations
paths:
  /credentials/read.php:
    get:
      tags:
        - Credentials
      summary: Read credentials
      description: |
        Retrieves credentials accessible to the authenticated API user,
        with credential_username and credential_password decrypted.

        Requires api_key_decrypt_password. If credential_id is supplied,
        a single credential is returned; otherwise a paginated list of
        all credentials accessible to the authenticated user is returned.

        api_key_decrypt_password must be sent in the JSON request body,
        not as a query parameter, even though this is a GET request.
      operationId: readCredentials
      security:
        - ApiKeyAuth: []
      parameters:
        - name: client_id
          in: query
          required: false
          description: |
            Optional client ID to scope the read to a specific client.
            This is only used when the authenticated API key has access
            to that client.
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: credential_id
          in: query
          required: false
          description: Retrieve a single credential by its ID.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 123
        - name: limit
          in: query
          required: false
          description: |
            Maximum number of records returned for collection queries.
            Defaults to 50.
          schema:
            type: integer
            minimum: 0
            default: 50
          example: 50
        - name: offset
          in: query
          required: false
          description: |
            Number of records to skip for collection queries.
            Defaults to 0.
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - api_key_decrypt_password
              properties:
                api_key_decrypt_password:
                  type: string
                  description: |
                    Decryption secret used, together with the API key's
                    server-side decrypt hash, to decrypt
                    credential_username and credential_password.
            example:
              api_key_decrypt_password: correct-horse-battery-staple
      responses:
        '200':
          description: |
            Request processed successfully. The response may contain
            matching resources or indicate that no resources were found.
            Unlike other read endpoints, this response is built directly
            in read.php (not read_output.php) so that credential_username
            and credential_password can be decrypted before being
            returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadResponse'
              examples:
                credentialsFound:
                  summary: Credentials found
                  value:
                    success: 'True'
                    count: 1
                    data:
                      - credential_id: 123
                        credential_name: Server01 admin
                        credential_description: Local admin login
                        credential_category: Server
                        credential_uri: https://server01.example.com
                        credential_uri_2: ''
                        credential_username: admin
                        credential_password: correct-horse-battery-staple
                        credential_otp_secret: null
                        credential_note: Rotate quarterly
                        credential_favorite: 0
                        credential_created_at: '2026-01-15 09:00:00'
                        credential_updated_at: null
                        credential_archived_at: null
                        credential_accessed_at: null
                        credential_password_changed_at: '2026-01-15 09:00:00'
                        credential_folder_id: 0
                        credential_contact_id: 25
                        credential_asset_id: 123
                        credential_client_id: 1
                noCredentialsFound:
                  summary: No matching credentials
                  value:
                    success: 'False'
                    message: >-
                      No resource (for this client and company) with the
                      specified parameter(s).
        '401':
          description: Authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: 'False'
                message: Authentication failed. API key is invalid or has expired.
        '403':
          description: |
            The authenticated user does not have permission to read
            credentials or does not have access to the relevant client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                permissionDenied:
                  summary: Insufficient permission
                  value:
                    success: 'False'
                    message: >-
                      The user linked to this API key does not have permission
                      for this action.
                resourceDenied:
                  summary: Resource not mapped
                  value:
                    success: 'False'
                    message: This API resource is not mapped to a permission module.
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: 'False'
                message: Can only send GET requests to this endpoint.
  /credentials/create.php:
    post:
      tags:
        - Credentials
      summary: Create a credential
      description: |
        Creates a new credential for a client. credential_username and
        credential_password are encrypted using api_key_decrypt_password
        before being stored.

        Requires client_id, credential_name, credential_password, and
        api_key_decrypt_password.
      operationId: createCredential
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCredentialRequest'
            example:
              client_id: 1
              api_key_decrypt_password: correct-horse-battery-staple
              credential_name: Server01 admin
              credential_description: Local admin login
              credential_uri: https://server01.example.com
              credential_username: admin
              credential_password: correct-horse-battery-staple
              credential_otp_secret: JBSWY3DPEHPK3PXP
              credential_note: Rotate quarterly
              credential_favorite: 0
              credential_contact_id: 25
              credential_asset_id: 123
      responses:
        '200':
          description: |
            The request was processed. The PHP implementation returns
            a success or failure object from create_output.php.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CreateSuccessResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                created:
                  summary: Credential created
                  value:
                    success: 'True'
                    count: '1'
                    data:
                      - insert_id: 123
                insertFailed:
                  summary: Insert failed
                  value:
                    success: 'False'
                    message: >-
                      Auth success but insert query failed, ensure ALL required
                      variables are provided (and aren't duplicates where
                      applicable) and database schema is up-to-date. Turn on
                      error logging and look for 'undefined index'.
                fieldTooLong:
                  summary: Field exceeds column length
                  value:
                    success: 'False'
                    message: credential_password is too long to store.
        '401':
          description: Authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: 'False'
                message: Authentication failed. API key is invalid or has expired.
        '403':
          description: |
            The authenticated user does not have permission to create
            credentials or does not have access to the target client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                permissionDenied:
                  summary: Insufficient permission
                  value:
                    success: 'False'
                    message: >-
                      The user linked to this API key does not have permission
                      for this action.
                clientDenied:
                  summary: Client access denied
                  value:
                    success: 'False'
                    message: >-
                      The user linked to this API key does not have access to
                      the target client for this write.
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: 'False'
                message: Can only send POST requests to this endpoint.
  /credentials/update.php:
    post:
      tags:
        - Credentials
      summary: Update a credential
      description: |
        Updates an existing credential for the authenticated client.

        Requires credential_id and api_key_decrypt_password. Any other
        field omitted from the request is treated as the current
        database value - for credential_username and credential_password
        this means the existing encrypted value is kept as-is (it is not
        decrypted and re-encrypted). Providing credential_password
        refreshes credential_password_changed_at.
      operationId: updateCredential
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCredentialRequest'
            example:
              client_id: 1
              credential_id: 123
              api_key_decrypt_password: correct-horse-battery-staple
              credential_name: Server01 admin
              credential_description: Local admin login
              credential_uri: https://server01.example.com
              credential_username: admin
              credential_password: new-correct-horse-battery-staple
              credential_otp_secret: JBSWY3DPEHPK3PXP
              credential_note: Rotate quarterly
              credential_favorite: 1
              credential_contact_id: 25
              credential_asset_id: 123
      responses:
        '200':
          description: |
            The request was processed. The PHP implementation returns
            a success or failure object from update_output.php. No data
            array is returned on success - only success and count.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/UpdateSuccessResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                updated:
                  summary: Credential updated
                  value:
                    success: 'True'
                    count: 1
                updateFailed:
                  summary: Update failed
                  value:
                    success: 'False'
                    message: >-
                      Auth success but update query failed/returned no results.
                      Ensure ALL required variables are provided and database
                      schema is up-to-date. Most likely cause: non-existent
                      module ID (i.e. bad contact ID/ticket ID/etc) or no rows
                      changed.
                fieldTooLong:
                  summary: Field exceeds column length
                  value:
                    success: 'False'
                    message: credential_password is too long to store.
        '401':
          description: Authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: 'False'
                message: Authentication failed. API key is invalid or has expired.
        '403':
          description: |
            The authenticated user does not have permission to update
            credentials or does not have access to the target client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                permissionDenied:
                  summary: Insufficient permission
                  value:
                    success: 'False'
                    message: >-
                      The user linked to this API key does not have permission
                      for this action.
                clientDenied:
                  summary: Client access denied
                  value:
                    success: 'False'
                    message: >-
                      The user linked to this API key does not have access to
                      the target client for this write.
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: 'False'
                message: Can only send POST requests to this endpoint.
  /credentials/archive.php:
    post:
      tags:
        - Credentials
      summary: Archive a credential
      description: |
        Archives an existing, currently non-archived credential for the
        authenticated client.

        Requires credential_id. Only affects credentials where
        credential_archived_at IS NULL. On success, credential_favorite
        is reset to 0 and credential_archived_at is set to the current
        timestamp.
      operationId: archiveCredential
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveCredentialRequest'
            example:
              client_id: 1
              credential_id: 123
      responses:
        '200':
          description: |
            The request was processed. The PHP implementation returns
            a success or failure object from update_output.php. No data
            array is returned on success - only success and count.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/UpdateSuccessResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                archived:
                  summary: Credential archived
                  value:
                    success: 'True'
                    count: 1
                archiveFailed:
                  summary: Archive failed
                  value:
                    success: 'False'
                    message: >-
                      Auth success but update query failed/returned no results.
                      Ensure ALL required variables are provided and database
                      schema is up-to-date. Most likely cause: non-existent
                      module ID (i.e. bad contact ID/ticket ID/etc) or no rows
                      changed.
        '401':
          description: Authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: 'False'
                message: Authentication failed. API key is invalid or has expired.
        '403':
          description: |
            The authenticated user does not have permission to archive
            credentials or does not have access to the target client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                permissionDenied:
                  summary: Insufficient permission
                  value:
                    success: 'False'
                    message: >-
                      The user linked to this API key does not have permission
                      for this action.
                clientDenied:
                  summary: Client access denied
                  value:
                    success: 'False'
                    message: >-
                      The user linked to this API key does not have access to
                      the target client for this write.
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: 'False'
                message: Can only send POST requests to this endpoint.
  /credentials/unarchive.php:
    post:
      tags:
        - Credentials
      summary: Unarchive a credential
      description: |
        Unarchives an existing, currently archived credential for the
        authenticated client.

        Requires credential_id. Only affects credentials where
        credential_archived_at IS NOT NULL. On success, credential_archived_at
        is cleared.
      operationId: unarchiveCredential
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnarchiveCredentialRequest'
            example:
              client_id: 1
              credential_id: 123
      responses:
        '200':
          description: |
            The request was processed. The PHP implementation returns
            a success or failure object from update_output.php. No data
            array is returned on success - only success and count.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/UpdateSuccessResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                unarchived:
                  summary: Credential unarchived
                  value:
                    success: 'True'
                    count: 1
                unarchiveFailed:
                  summary: Unarchive failed
                  value:
                    success: 'False'
                    message: >-
                      Auth success but update query failed/returned no results.
                      Ensure ALL required variables are provided and database
                      schema is up-to-date. Most likely cause: non-existent
                      module ID (i.e. bad contact ID/ticket ID/etc) or no rows
                      changed.
        '401':
          description: Authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: 'False'
                message: Authentication failed. API key is invalid or has expired.
        '403':
          description: |
            The authenticated user does not have permission to unarchive
            credentials or does not have access to the target client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                permissionDenied:
                  summary: Insufficient permission
                  value:
                    success: 'False'
                    message: >-
                      The user linked to this API key does not have permission
                      for this action.
                clientDenied:
                  summary: Client access denied
                  value:
                    success: 'False'
                    message: >-
                      The user linked to this API key does not have access to
                      the target client for this write.
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: 'False'
                message: Can only send POST requests to this endpoint.
  /credentials/delete.php:
    post:
      tags:
        - Credentials
      summary: Delete a credential
      description: |
        Permanently deletes an existing credential for the authenticated
        client. Requires credential_id. The credential must already be
        archived.
      operationId: deleteCredential
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteCredentialRequest'
            example:
              client_id: 1
              credential_id: 123
      responses:
        '200':
          description: |
            The request was processed. The PHP implementation returns
            either a successful delete payload or a logical failure payload,
            while still using HTTP 200 OK. No data array is returned on
            success - only success and count.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DeleteSuccessResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                deleted:
                  summary: Credential deleted
                  value:
                    success: 'True'
                    count: 1
                deleteFailed:
                  summary: Delete failed
                  value:
                    success: 'False'
                    message: >-
                      Auth success but delete query failed. Ensure ALL required
                      variables are provided and database schema is up-to-date.
                      Most likely cause: asset/client/company ID mismatch.
        '401':
          description: Authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: 'False'
                message: Authentication failed. API key is invalid or has expired.
        '403':
          description: |
            The authenticated user does not have permission to delete
            credentials or does not have access to the target client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                permissionDenied:
                  summary: Insufficient permission
                  value:
                    success: 'False'
                    message: >-
                      The user linked to this API key does not have permission
                      for this action.
                clientDenied:
                  summary: Client access denied
                  value:
                    success: 'False'
                    message: >-
                      The user linked to this API key does not have access to
                      the target client for this write.
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: 'False'
                message: Can only send POST requests to this endpoint.
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: query
      name: api_key
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: string
          example: 'False'
        message:
          type: string
          example: Authentication failed. API key is invalid or has expired.
        count:
          type: integer
          nullable: true
          example: null
        data:
          type: array
          nullable: true
          items: {}
    ReadResponse:
      type: object
      properties:
        success:
          type: string
          example: 'True'
        count:
          type: integer
          example: 1
        message:
          type: string
          nullable: true
          example: null
        data:
          type: array
          items:
            $ref: '#/components/schemas/CredentialRecord'
    CreateSuccessResponse:
      type: object
      properties:
        success:
          type: string
          example: 'True'
        count:
          type: string
          example: '1'
        data:
          type: array
          items:
            type: object
            properties:
              insert_id:
                type: integer
                example: 123
    UpdateSuccessResponse:
      type: object
      description: |
        Returned by update.php, archive.php, and unarchive.php - all three
        share the same update_output.php response handler and therefore
        only ever return success and count on success (no data array).
      properties:
        success:
          type: string
          example: 'True'
        count:
          type: integer
          example: 1
    DeleteSuccessResponse:
      type: object
      properties:
        success:
          type: string
          example: 'True'
        count:
          type: integer
          example: 1
    CredentialRecord:
      type: object
      description: |
        credential_username and credential_password are returned decrypted.
      properties:
        credential_id:
          type: integer
          example: 123
        credential_name:
          type: string
          maxLength: 200
          example: Server01 admin
        credential_description:
          type: string
          nullable: true
          maxLength: 500
          example: Local admin login
        credential_category:
          type: string
          nullable: true
          description: Not settable via this API.
          example: Server
        credential_uri:
          type: string
          nullable: true
          maxLength: 500
          example: https://server01.example.com
        credential_uri_2:
          type: string
          nullable: true
          maxLength: 500
          example: ''
        credential_username:
          type: string
          nullable: true
          description: >-
            Returned decrypted. Stored encrypted; maxLength applies to the
            plaintext value.
          maxLength: 500
          example: admin
        credential_password:
          type: string
          nullable: true
          description: >-
            Returned decrypted. Stored encrypted; maxLength applies to the
            plaintext value.
          maxLength: 500
          example: correct-horse-battery-staple
        credential_otp_secret:
          type: string
          nullable: true
          maxLength: 200
          example: JBSWY3DPEHPK3PXP
        credential_note:
          type: string
          nullable: true
          example: Rotate quarterly
        credential_favorite:
          type: integer
          enum:
            - 0
            - 1
          example: 0
        credential_created_at:
          type: string
          format: date-time
          example: '2026-01-15 09:00:00'
        credential_updated_at:
          type: string
          format: date-time
          nullable: true
          example: null
        credential_archived_at:
          type: string
          format: date-time
          nullable: true
          example: null
        credential_accessed_at:
          type: string
          format: date-time
          nullable: true
          description: Not settable via this API.
          example: null
        credential_password_changed_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-01-15 09:00:00'
        credential_folder_id:
          type: integer
          description: Not settable via this API.
          example: 0
        credential_contact_id:
          type: integer
          example: 25
        credential_asset_id:
          type: integer
          example: 123
        credential_client_id:
          type: integer
          example: 1
    CreateCredentialRequest:
      type: object
      required:
        - client_id
        - credential_name
        - credential_password
        - api_key_decrypt_password
      properties:
        client_id:
          type: integer
          example: 1
        api_key_decrypt_password:
          type: string
          description: |
            Decryption secret used, together with the API key's
            server-side decrypt hash, to encrypt credential_username and
            credential_password before storage.
          example: correct-horse-battery-staple
        credential_name:
          type: string
          maxLength: 200
          example: Server01 admin
        credential_description:
          type: string
          nullable: true
          maxLength: 500
          example: Local admin login
        credential_uri:
          type: string
          nullable: true
          maxLength: 500
          example: https://server01.example.com
        credential_uri_2:
          type: string
          nullable: true
          maxLength: 500
          example: ''
        credential_username:
          type: string
          nullable: true
          description: Plaintext; encrypted before storage.
          maxLength: 500
          example: admin
        credential_password:
          type: string
          description: Plaintext; encrypted before storage.
          maxLength: 500
          example: correct-horse-battery-staple
        credential_otp_secret:
          type: string
          nullable: true
          maxLength: 200
          example: JBSWY3DPEHPK3PXP
        credential_note:
          type: string
          nullable: true
          example: Rotate quarterly
        credential_favorite:
          type: integer
          enum:
            - 0
            - 1
          default: 0
          example: 0
        credential_contact_id:
          type: integer
          default: 0
          example: 25
        credential_asset_id:
          type: integer
          default: 0
          example: 123
    UpdateCredentialRequest:
      type: object
      required:
        - client_id
        - credential_id
        - api_key_decrypt_password
      properties:
        client_id:
          type: integer
          example: 1
        credential_id:
          type: integer
          example: 123
        api_key_decrypt_password:
          type: string
          description: |
            Decryption secret used, together with the API key's
            server-side decrypt hash, to encrypt credential_username and
            credential_password before storage.
          example: correct-horse-battery-staple
        credential_name:
          type: string
          maxLength: 200
          example: Server01 admin
        credential_description:
          type: string
          nullable: true
          maxLength: 500
          example: Local admin login
        credential_uri:
          type: string
          nullable: true
          maxLength: 500
          example: https://server01.example.com
        credential_uri_2:
          type: string
          nullable: true
          maxLength: 500
          example: ''
        credential_username:
          type: string
          nullable: true
          description: |
            Plaintext; encrypted before storage. If omitted, the existing
            encrypted value is kept as-is.
          maxLength: 500
          example: admin
        credential_password:
          type: string
          nullable: true
          description: |
            Plaintext; encrypted before storage. If omitted, the existing
            encrypted value is kept as-is. If provided,
            credential_password_changed_at is refreshed.
          maxLength: 500
          example: new-correct-horse-battery-staple
        credential_otp_secret:
          type: string
          nullable: true
          maxLength: 200
          example: JBSWY3DPEHPK3PXP
        credential_note:
          type: string
          nullable: true
          example: Rotate quarterly
        credential_favorite:
          type: integer
          enum:
            - 0
            - 1
          example: 1
        credential_contact_id:
          type: integer
          example: 25
        credential_asset_id:
          type: integer
          example: 123
    ArchiveCredentialRequest:
      type: object
      required:
        - client_id
        - credential_id
      properties:
        client_id:
          type: integer
          example: 1
        credential_id:
          type: integer
          example: 123
    UnarchiveCredentialRequest:
      type: object
      required:
        - client_id
        - credential_id
      properties:
        client_id:
          type: integer
          example: 1
        credential_id:
          type: integer
          example: 123
    DeleteCredentialRequest:
      type: object
      required:
        - client_id
        - credential_id
      properties:
        client_id:
          type: integer
          example: 1
        credential_id:
          type: integer
          example: 123
